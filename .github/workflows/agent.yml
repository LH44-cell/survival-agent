name: survival-agents

on:
  schedule:
    - cron: "7 */2 * * *"    # varannan timme (GitHub kan fördröja några minuter)
  workflow_dispatch:         # manuell körning från Actions-fliken

permissions:
  contents: write

concurrency:
  group: survival-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run all agents
        env:
          SURVIVAL_API_KEY: ${{ secrets.SURVIVAL_API_KEY }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
        run: |
          for a in opus fable; do
            python agent.py --agent "$a" || echo "agent $a failed"
          done
      - name: Build status page
        run: python build_status.py
      - name: Commit state, logs and status page
        run: |
          git config user.name "survival-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state logs docs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "cycle $(date -u +%Y-%m-%dT%H:%M)"
          git push
